name: Deploy to DigitalOcean Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/meetjoshi-portfolio
  APP_SUBDIR: apps/frontend

jobs:
  deploy:
    name: Deploy on Droplet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=0
          for var in DROPLET_HOST DROPLET_USER DROPLET_SSH_KEY; do
            if [ -z "${!var}" ]; then
              echo "❌ Missing required secret: $var"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "One or more required secrets are missing."
            exit 1
          fi
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}

      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          envs: SUPABASE_URL,SUPABASE_ANON_KEY,GITHUB_SHA
          script: |
            set -e

            if [ ! -d "${{ env.DEPLOY_PATH }}" ]; then
              sudo mkdir -p "${{ env.DEPLOY_PATH }}"
              sudo chown -R "$USER":"$USER" "${{ env.DEPLOY_PATH }}"
            fi

            cd "${{ env.DEPLOY_PATH }}"

            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }}.git .
            fi

            git fetch origin
            git checkout main
            git reset --hard origin/main

            cd "${{ env.APP_SUBDIR }}"

            docker build \
              --build-arg SUPABASE_URL="$SUPABASE_URL" \
              --build-arg SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
              -t meetjoshi-portfolio:${GITHUB_SHA} \
              -t meetjoshi-portfolio:latest \
              .

            docker stop meetjoshi-portfolio || true
            docker rm meetjoshi-portfolio || true

            docker run -d \
              --name meetjoshi-portfolio \
              --restart unless-stopped \
              -p 80:3000 \
              meetjoshi-portfolio:${GITHUB_SHA}

      - name: Create deployment summary
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** DigitalOcean Droplet" >> $GITHUB_STEP_SUMMARY
          echo "**Host:** ${{ secrets.DROPLET_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "**Path:** ${{ env.DEPLOY_PATH }}" >> $GITHUB_STEP_SUMMARY
          echo "**App Directory:** ${{ env.APP_SUBDIR }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = 'success' ]; then
            echo "✅ Deployment completed successfully!"
          else
            echo "❌ Deployment failed. Check the logs for details."
            exit 1
          fi
