name: Deploy Frontend & Backend to DigitalOcean Droplet

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DEPLOY_PATH: /opt/meetjoshi-portfolio
  FRONTEND_SUBDIR: apps/frontend
  BACKEND_SUBDIR: apps/backend

jobs:
  deploy:
    name: Deploy on Droplet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          missing=0
          for var in DROPLET_HOST DROPLET_USER DROPLET_SSH_KEY FRONTEND_API_URL; do
            if [ -z "${!var}" ]; then
              echo "❌ Missing required secret: $var"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "One or more required secrets are missing."
            exit 1
          fi
        env:
          DROPLET_HOST: ${{ secrets.DROPLET_HOST }}
          DROPLET_USER: ${{ secrets.DROPLET_USER }}
          DROPLET_SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          FRONTEND_API_URL: ${{ secrets.FRONTEND_API_URL }}

      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FRONTEND_API_URL: ${{ secrets.FRONTEND_API_URL }}
          BACKEND_FRONTEND_URL: ${{ secrets.BACKEND_FRONTEND_URL }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          port: ${{ secrets.DROPLET_PORT || 22 }}
          envs: SUPABASE_URL,SUPABASE_ANON_KEY,FRONTEND_API_URL,BACKEND_FRONTEND_URL,GITHUB_SHA
          script: |
            set -e

            if [ ! -d "${{ env.DEPLOY_PATH }}" ]; then
              sudo mkdir -p "${{ env.DEPLOY_PATH }}"
              sudo chown -R "$USER":"$USER" "${{ env.DEPLOY_PATH }}"
            fi

            cd "${{ env.DEPLOY_PATH }}"

            if [ ! -d .git ]; then
              git clone https://github.com/${{ github.repository }}.git .
            fi

            git fetch origin
            git checkout main
            git reset --hard origin/main

            if [ ! -f "${{ env.FRONTEND_SUBDIR }}/Dockerfile" ]; then
              echo "Missing Dockerfile at ${{ env.FRONTEND_SUBDIR }}/Dockerfile"
              exit 1
            fi

            if [ ! -f "${{ env.BACKEND_SUBDIR }}/Dockerfile" ]; then
              echo "Missing Dockerfile at ${{ env.BACKEND_SUBDIR }}/Dockerfile"
              exit 1
            fi

            docker build \
              -f "${{ env.BACKEND_SUBDIR }}/Dockerfile" \
              -t meetjoshi-backend:${GITHUB_SHA} \
              -t meetjoshi-backend:latest \
              .

            docker build \
              -f "${{ env.FRONTEND_SUBDIR }}/Dockerfile" \
              --build-arg API_URL="$FRONTEND_API_URL" \
              --build-arg SUPABASE_URL="$SUPABASE_URL" \
              --build-arg SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
              -t meetjoshi-frontend:${GITHUB_SHA} \
              -t meetjoshi-frontend:latest \
              .

            docker stop meetjoshi-backend || true
            docker rm meetjoshi-backend || true
            docker stop meetjoshi-frontend || true
            docker rm meetjoshi-frontend || true

            docker run -d \
              --name meetjoshi-backend \
              --restart unless-stopped \
              -e PORT=8080 \
              -e FRONTEND_URL="$BACKEND_FRONTEND_URL" \
              -p 4000:8080 \
              meetjoshi-backend:${GITHUB_SHA}

            docker run -d \
              --name meetjoshi-frontend \
              --restart unless-stopped \
              -p 80:8080 \
              meetjoshi-frontend:${GITHUB_SHA}

      - name: Create deployment summary
        run: |
          echo "## 🚀 Frontend + Backend Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** DigitalOcean Droplet" >> $GITHUB_STEP_SUMMARY
          echo "**Host:** ${{ secrets.DROPLET_HOST }}" >> $GITHUB_STEP_SUMMARY
          echo "**Path:** ${{ env.DEPLOY_PATH }}" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Directory:** ${{ env.FRONTEND_SUBDIR }}" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Directory:** ${{ env.BACKEND_SUBDIR }}" >> $GITHUB_STEP_SUMMARY
          echo "**Frontend Port:** 80 -> 8080" >> $GITHUB_STEP_SUMMARY
          echo "**Backend Port:** 4000 -> 8080" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment status
        if: always()
        run: |
          if [ "${{ job.status }}" = 'success' ]; then
            echo "✅ Deployment completed successfully!"
          else
            echo "❌ Deployment failed. Check the logs for details."
            exit 1
          fi
